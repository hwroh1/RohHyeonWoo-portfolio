<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundeuk</title>
    <link rel="stylesheet" href="./style.css?v=2.0">
</head>
<body>
    <!-- Link Section -->
    <div class="link-section">
        <img src="./images/favicon.png" alt="Favicon" class="favicon-image">
        <a href="https://hwroh1.github.io/Mundeuk/" target="_blank" class="project-link">https://hwroh1.github.io/Mundeuk/</a>
    </div>
    
    <!-- Mainpage Video Section -->
    <div class="mainpage-video-section">
        <div class="mainpage-video-container">
            <video class="mainpage-video" muted playsinline autoplay loop controls>
                <source src="./mainpage_video.mov" type="video/mp4">
            </video>
        </div>
    </div>
    
    <!-- 로고 -->
    <div class="logo-container">
        <img src="./images/logo.png" alt="Logo" class="logo">
    </div>
    
    <!-- Introduce 이미지 -->
    <div class="introduce-container">
        <img src="./images/introduce.png" alt="Introduce" class="introduce-image">
    </div>
    
    <!-- Effects 이미지와 Charts 비디오 -->
    <div class="effects-charts-container">
        <div class="effects-container">
            <img src="./images/effects.png" alt="Effects" class="effects-image">
        </div>
        <div class="charts-video-container">
            <video class="charts-video" muted playsinline autoplay>
                <source src="./charts.mov" type="video/mp4">
            </video>
        </div>
    </div>
    
    <!-- Webmain 이미지 -->
    <div class="webmain-container">
        <img src="./images/webmain.png" alt="Webmain" class="webmain-image">
    </div>
    
    <!-- Brand Image -->
    <div class="brand-container">
        <img src="./images/brand.png" alt="Brand" class="brand-image">
    </div>
    
    <!-- Mockup 1 Image -->
    <div class="mockup1-container">
        <img src="./images/mockup1.png" alt="Mockup 1" class="mockup1-image">
    </div>
    
    <!-- Sticker GIF -->
    <div class="sticker-container">
        <img src="./images/sticker.gif" alt="Sticker" class="sticker-image">
    </div>
    
    <!-- Mockup 2 Image -->
    <div class="mockup2-container">
        <img src="./images/mockup2.png" alt="Mockup 2" class="mockup2-image">
    </div>
    
    <!-- 네비게이션 버튼 -->
    <div class="nav-buttons">
        <a href="../work3/index.html" class="nav-button nav-prev">
            <span class="nav-arrow"><</span>
        </a>
        <a href="../index.html" class="home-button" id="homeButton">
            <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6"></path>
            </svg>
        </a>
        <a href="../work5/index.html" class="nav-button nav-next">
            <span class="nav-arrow">></span>
        </a>
    </div>
    
    <script src="./script.js?v=2.0"></script>
</body>
</html>
